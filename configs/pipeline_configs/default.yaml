benchmarks:
- PubMedQA
- MedMCQA
- HeartDisease
- gsm8k
- judgebench
- Iris
- MMLU
- hover

evaluation_config:
  dataset_mode: test  # Use 'test' for faster runs, 'full' for complete evaluation
  lm: openrouter/meta-llama/llama-3.3-70b-instruct
  lm_api_base: https://openrouter.ai/api/v1
  num_threads: 32
  max_concurrent_processes: 4

optimization:
  base_url: https://openrouter.ai/api/v1
  max_concurrent: 5
  model: meta-llama/llama-3.3-70b-instruct
  sample_size: 25
  temperature: 0.3
  
  # Your custom strategies (ce1, ce2) from YAML templates
  strategies:
  - quick_improve
  
  template_files:
  - "configs/meta_templates/custom_strategies.yaml"
  
  # You can also define templates directly in the config
  custom_templates:
    quick_improve: |
      Improve the following prompt to be more effective: {original_system_prompt}
      
      Make it clearer, more specific, and better structured.
      
      Improved prompt:

output_dir: meta-optimize-prompt
